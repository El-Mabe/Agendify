services:
  postgres:
    image: postgres:16-alpine
    container_name: mediagenda-postgres
    environment:
      POSTGRES_DB: mediagenda
      POSTGRES_USER: mediagenda
      POSTGRES_PASSWORD: mediagenda
    ports:
      - "5432:5432"
    volumes:
      - mediagenda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediagenda -d mediagenda"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mediagenda_pgdata:
