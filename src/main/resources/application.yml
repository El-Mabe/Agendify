spring:
  application:
    name: mediagenda-bot
  datasource:
    # Railway inyecta PGHOST/PGPORT/PGUSER/PGPASSWORD/PGDATABASE al referenciar el servicio Postgres.
    # Localmente (sin perfil) usa los defaults; con perfil `local` aplica application-local.yml.
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:mediagenda}
    username: ${PGUSER:mediagenda}
    password: ${PGPASSWORD:mediagenda}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

whatsapp:
  api-url: https://graph.facebook.com
  version: v23.0
  token: ${WHATSAPP_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:}

google:
  sheets:
    enabled: ${GOOGLE_SHEETS_ENABLED:false}
    # Legacy (un solo archivo con pestañas A_ y B_). Preferir A/B separados.
    spreadsheet-id: ${GOOGLE_SHEETS_SPREADSHEET_ID:}
    spreadsheet-id-a: ${GOOGLE_SHEETS_SPREADSHEET_ID_A:}
    spreadsheet-id-b: ${GOOGLE_SHEETS_SPREADSHEET_ID_B:}
    # Festivos + Informacion. Si vacío, usa A o el legacy.
    spreadsheet-id-shared: ${GOOGLE_SHEETS_SPREADSHEET_ID_SHARED:}
    # Railway/producción: pega el JSON completo en GOOGLE_SHEETS_CREDENTIALS_JSON
    credentials-json: ${GOOGLE_SHEETS_CREDENTIALS_JSON:}
    # Local: ruta al archivo JSON (perfil local en application-local.yml)
    credentials-path: ${GOOGLE_SHEETS_CREDENTIALS_PATH:}
    holidays-sheet: Festivos
    information-sheet: Informacion

appointments:
  sheet-sync:
    enabled: ${APPOINTMENT_SHEET_SYNC_ENABLED:${GOOGLE_SHEETS_ENABLED:false}}
    webhook-token: ${APPOINTMENT_SHEET_SYNC_TOKEN:}
    bootstrap-enabled: ${APPOINTMENT_SHEET_BOOTSTRAP_ENABLED:false}
    bootstrap-months-back: ${APPOINTMENT_SHEET_BOOTSTRAP_MONTHS_BACK:1}
    bootstrap-months-forward: ${APPOINTMENT_SHEET_BOOTSTRAP_MONTHS_FORWARD:3}
    reconciliation-enabled: ${APPOINTMENT_SHEET_RECONCILIATION_ENABLED:false}
    reconciliation-months-forward: ${APPOINTMENT_SHEET_RECONCILIATION_MONTHS_FORWARD:1}
    reconciliation-delay-ms: ${APPOINTMENT_SHEET_RECONCILIATION_DELAY_MS:600000}
    retry-delay-ms: ${APPOINTMENT_SHEET_RETRY_DELAY_MS:60000}
    
logging:
  level:
    root: INFO
    com.ocnilentes: DEBUG

reminder:
  enabled: ${REMINDER_ENABLED:true}
  day-before-hour: ${REMINDER_DAY_BEFORE_HOUR:18}
  window-end-hour: ${REMINDER_WINDOW_END_HOUR:22}
  cron: "0 */15 18-22 * * *"
  # INTERACTIVE = botones (requiere ventana 24h). TEMPLATE = plantilla Meta aprobada (proactivo).
  send-mode: ${REMINDER_SEND_MODE:INTERACTIVE}
  template-name: ${REMINDER_TEMPLATE_NAME:cita_recordatorio}
  template-language: ${REMINDER_TEMPLATE_LANGUAGE:es_CO}
  manual-run-token: ${REMINDER_MANUAL_RUN_TOKEN:}

attendance-sync:
  enabled: ${ATTENDANCE_SYNC_ENABLED:true}
  window-start-hour: ${ATTENDANCE_SYNC_START_HOUR:20}
  window-end-hour: ${ATTENDANCE_SYNC_END_HOUR:22}
  cron: "0 */15 20-22 * * *"
  manual-run-token: ${ATTENDANCE_SYNC_MANUAL_RUN_TOKEN:}

follow-up:
  interval-months: ${FOLLOW_UP_INTERVAL_MONTHS:11}
