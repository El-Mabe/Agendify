spring:
  application:
    name: mediagenda-bot
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mediagenda}
    username: ${DATABASE_USERNAME:mediagenda}
    password: ${DATABASE_PASSWORD:mediagenda}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  flyway:
    enabled: true

server:
  port: 8080

